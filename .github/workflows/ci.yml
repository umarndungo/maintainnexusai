# MaintainNexus CI Workflow
#
# Triggered on every push to ``main`` or ``develop``, and on every pull
# request targeting ``main``. Runs the full test suite and reports pass /
# fail status back to the PR so the team can merge with confidence.

name: MaintainNexus CI Workflow

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            # 1. Check out the repository code.
            - uses: actions/checkout@v3

            # 2. Install the exact Python version used in development.
            - name: Set up Python 3.10
              uses: actions/setup-python@v4
              with:
                  python-version: "3.10"

            # 3. Install all project dependencies from the pinned lock file.
            - name: Install Dependencies
              run: |
                  python -m virtualenv venv
                  source venv/bin/activate
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            # 4. Execute the pytest suite. Any failure will fail the job.
            - name: Execute Pytest Suite
              run: pytest
